# Re-scrape devfestka.de and republish when the schedule changes (rooms, times, cancellations, new talks).
# Times are UTC: event day 08:00–20:00 Karlsruhe time = 07:00–19:00 UTC. GitHub may start scheduled runs a few minutes late.
name: Sync schedule
on:
  schedule:
    - cron: "*/10 7-18 7 11 *"   # every 10 min on event day
    - cron: "0 17-23 6 11 *"     # hourly the evening before
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html speakers
          git diff --cached --quiet || { git commit -m "Sync schedule from devfestka.de"; git push; }
